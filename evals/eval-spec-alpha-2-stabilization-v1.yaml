schema_version: "1.1"
estado: borrador
id: "ES-2026-001"

objective:
  titulo: "Alpha 2 workflow stabilization"
  descripcion: |
    Alpha testing showed that researchers cannot yet reliably complete the core HEVA
    workflow because project state, color configuration, extraction, annotation readiness,
    and validation feedback can be inconsistent or unclear. This undermines confidence in
    whether a generated Data Package is genuinely complete and valid.

    The current evidence is the Alpha 2 researcher feedback report; quantitative usability
    baseline data has not yet been collected. The expected outcome is that a researcher can
    open a project, see what each document lacks, configure colors, extract and review
    annotations, run validation, and generate a valid Data Package without editing JSON
    manually or encountering silent failures or contradictory readiness states.
  owner: "Jose Carlos Urra, product owner in consultation with HEVA researchers"
  alcance:
    incluye:
      - "Project and canonical data validation"
      - "Project registry and document readiness state"
      - "Command-line validation interoperability"
      - "FastAPI researcher workflow and actionable validation feedback"
      - "Active-document validation from the GUI and command-line interoperability"
      - "Explicit original-annotator assignment and contributor provenance per document"
      - "Validated Data Package export without internal repository-governance gates"
      - "Automated, integration, and manual alpha acceptance evidence"
    excluye:
      - "Changes to PDF or DOCX source documents"
      - "Changes to extraction algorithms or HEVA label meanings"
      - "Advanced curator, publication, and repository governance"
      - "Internal submission, curator acceptance, and data-owner approval as Alpha gates"
      - "Internal curator-review submission actions and status management"
      - "Automatic destructive repair of canonical project data"
      - "CSV as an editable canonical source"
  riesgos_identificados:
    - "HEVA may report a document or package complete while required data is inconsistent."
    - "Researchers may distribute incorrect training data believing it passed validation."
    - "Manual edits or external scripts may corrupt canonical JSON structurally or semantically."
    - "A repair could lose or reinterpret valid annotations, stable IDs, or review decisions."
    - "HEVA may incorrectly attribute source annotations to the active curator or an unrelated project person."
  adrs_referenciados:
    - "docs/adr/HEVA-ADR-001-versioned-eva-specifications.md"
    - "docs/adr/HEVA-ADR-002-repository-owned-approval.md"

implementation_evidence:
  updated: "2026-08-25"
  branch: "algorithm-improvement"
  automated_suite: "283 passed"
  completed:
    - "F14.2 aligned persisted, GUI, CLI, validation, and export gates"
    - "F14.1 canonical annotations rebuild after color confirmation"
    - "F14.6 independent sentence-review pagination"
    - "F14.11 removal of internal curator-submission workflow"
    - "F14.12 active-document validation and localized findings"
    - "F14.13 explicit original-annotator assignment"
    - "F14.14 annotation-only distribution validation contract"
    - "F14.20 selected valid-subset Data Package export"
  awaiting_human_review:
    - "F14.3 safe rejection of unreadable table-PDF font encoding"
    - "F14.16 explicit warning acceptance with retained audit evidence"
    - "F14.18 single embedded document workflow shell"
  partial:
    - feature: "F14.24 managed PDF import with atomic registry update"
      delivered: "Portable managed-source copy, checksum verification, duplicate and collision handling, and rollback-safe registry mutation"
      remains: "Native picker/API, web controls, shared notifications, restart acceptance, and user documentation"
    - feature: "F14.5 PDF evidence navigation"
      delivered: "Sentence actions reveal the standalone or embedded PDF pane at the persisted source page"
      remains: "Persisted coordinate evidence and color-filtered representative occurrences"
    - feature: "F14.4 observable and resilient large-document extraction"
      delivered: "Measured loop optimizations, command-line parity, live extraction stages, actual PDF page totals, cooperative cancellation, provenance-aware PDF page scope, and a reproducible synthetic 87-page scaling benchmark"
      remains: "Partial checkpoint resume, authorized representative large-PDF evidence, finer NLP progress"
    - feature: "F14.17 strict annotation correction"
      delivered: "Accepted browser persistence, F14.17B two-layer source/curated sentence correction, and F14.17C audited independent annotation exclusion"
      remains: "Creating new annotations remains a separately scoped future capability"
    - feature: "F14.23 shared application notifications"
      delivered: "One accessible top-of-app component with validation and selected Data Package export feedback"
      remains: "Extraction, setup, and sentence-review event integration"
  unstarted:
    - "F14.7-F14.10 remaining intake and usability features"
    - "F14.15 annotation context"
    - "F14.19 documentation delivery and special paths"
    - "F14.21 collaborative workspace identity"
    - "F14.22 Git-ready external Data Package destination"

budget:
  mode: implementation
  max_turns: 60
  max_input_tokens: 180000
  preferred_model: sonnet
  model_selection:
    scaffold: haiku
    spec_writing: sonnet
    implementation: sonnet
    test_execution: haiku
    reporting: sonnet
    review_gates: sonnet
  auto_tier: null
  hard_stop_at_overrun_pct: 50

evaluation:
  scope: system
  automated_tests:
    unit:
      - id: "A2-VAL-001"
        descripcion: "Malformed JSON is reported with its file and parse location without modifying it."
        tipo: "fail-to-pass"
        test_confidence: "functional"
        comando: "python -m pytest tests/workflow/test_evaluation.py -q -k corrupted_json"
      - id: "A2-VAL-002"
        descripcion: "Structurally valid but semantically inconsistent project data produces actionable findings."
        tipo: "fail-to-pass"
        test_confidence: "functional"
        comando: "python -m pytest tests/workflow/test_evaluation.py -q -k semantic_corruption"
      - id: "A2-VAL-003"
        descripcion: "A document without an explicit original-annotator assignment fails validation without auto-assigning the active curator."
        tipo: "fail-to-pass"
        test_confidence: "functional"
        comando: "python -m pytest tests/workflow/test_document_contributors.py tests/workflow/test_evaluation.py -q -k document_annotator"
      - id: "A2-VAL-004"
        descripcion: "Optional document rights and color-detection provenance do not block an annotation-only package, while dataset license and rights remain mandatory."
        tipo: "fail-to-pass"
        test_confidence: "functional"
        comando: "python -m pytest tests/workflow/test_document_metadata.py tests/workflow/test_package_validator.py -q -k 'optional_document_rights or color_detection_method or dataset_license'"
      - id: "A2-REG-001"
        descripcion: "Valid canonical HEVA records continue to satisfy the existing contract and semantics."
        tipo: "pass-to-pass"
        test_confidence: "functional"
        comando: "python -m pytest tests/workflow/test_contract.py tests/extraction/test_extractor_regression.py -q"
      - id: "A2-REG-002"
        descripcion: "Stable document IDs and persisted review decisions survive project resynchronization."
        tipo: "pass-to-pass"
        test_confidence: "integration"
        comando: "python -m pytest tests/workflow/test_project_registry.py tests/workflow/test_review_state.py -q"
      - id: "A2-REG-003"
        descripcion: "CSV remains a generated derivative and package compilation reads canonical JSON."
        tipo: "pass-to-pass"
        test_confidence: "integration"
        comando: "python -m pytest tests/workflow/test_package_compiler.py tests/workflow/test_release_builder.py -q"
    integration:
      - id: "A2-INT-001"
        descripcion: "CLI and domain validation return equivalent blocking findings for the same corrupted fixture."
        tipo: "fail-to-pass"
        test_confidence: "integration"
        comando: "python -m pytest tests/workflow/test_evaluation.py -q -k cli_and_domain_corruption"
      - id: "A2-INT-002"
        descripcion: "The web application presents validation failures without a server error or silent hang."
        tipo: "fail-to-pass"
        test_confidence: "integration"
        comando: "python -m pytest tests/app/test_web_foundation.py -q -k validation_failure"
      - id: "A2-INT-003"
        descripcion: "Working, valid, and exported outcomes immediately reflect persisted preparation and validation state."
        tipo: "fail-to-pass"
        test_confidence: "integration"
        comando: "python -m pytest tests/workflow/test_alpha_journey.py -q -k readiness"
      - id: "A2-INT-004"
        descripcion: "A valid Alpha project exports without internal submission, curator acceptance, data-owner approval, candidate snapshot, or done-state evidence."
        tipo: "fail-to-pass"
        test_confidence: "integration"
        comando: "python -m pytest tests/workflow/test_alpha_journey.py tests/workflow/test_package_validator.py -q -k repository_owned_approval"
      - id: "A2-INT-005"
        descripcion: "The active-document validation endpoint and command-line path return equivalent blocking findings without modifying project data."
        tipo: "fail-to-pass"
        test_confidence: "integration"
        comando: "python -m pytest tests/app/test_web_foundation.py tests/workflow/test_evaluation.py -q -k document_validation"
      - id: "A2-INT-006"
        descripcion: "Researcher-facing views and Alpha export contain no internal curator-submission action or gate."
        tipo: "fail-to-pass"
        test_confidence: "integration"
        comando: "python -m pytest tests/app/test_web_foundation.py tests/workflow/test_alpha_journey.py -q -k no_internal_submission"
      - id: "A2-INT-007"
        descripcion: "Project people, document annotator assignments, checklist readiness, validation, and export resolve the same stable contributor identities."
        tipo: "fail-to-pass"
        test_confidence: "integration"
        comando: "python -m pytest tests/workflow/test_document_contributors.py tests/app/test_web_foundation.py tests/workflow/test_alpha_journey.py -q -k annotator_assignment"
    functional:
      - id: "A2-FLOW-001"
        descripcion: "A researcher can prepare, validate, and export a Data Package through the supported Alpha journey without an internal approval workflow."
        tipo: "fail-to-pass"
        test_confidence: "integration"
        golden_data: "examples/incomplete-dummy-project"
        comando: "python -m pytest tests/workflow/test_alpha_journey.py -q"
      - id: "A2-FLOW-002"
        descripcion: "A corrupted project is blocked from package generation and receives repair-oriented findings."
        tipo: "fail-to-pass"
        test_confidence: "integration"
        golden_data: "tests/fixtures/corrupted-project"
        comando: "python -m pytest tests/workflow/test_evaluation.py tests/workflow/test_package_compiler.py -q -k corrupted"
    e2e:
      - id: "A2-E2E-001"
        descripcion: "A browser-level researcher journey opens a project, resolves visible preparation gates, validates it, and exports a Data Package without manual JSON editing or internal approval steps."
        tipo: "fail-to-pass"
        test_confidence: "integration"
        comando: "python -m pytest tests/app/test_web_foundation.py tests/workflow/test_alpha_journey.py -q -k alpha_e2e"
    contract:
      - id: "A2-CONTRACT-001"
        descripcion: "Validation preserves the canonical HEVA data contract and controlled vocabulary."
        tipo: "pass-to-pass"
        test_confidence: "functional"
        comando: "python -m pytest tests/workflow/test_contract.py -q"
    architecture: []
    bootstrap:
      - id: "A2-BOOT-001"
        descripcion: "The FastAPI application imports and answers its home route in the supported environment."
        tipo: "pass-to-pass"
        test_confidence: "integration"
        comando: "python -m pytest tests/app/test_web_foundation.py -q -k home"

  live_verification:
    comando: "python -m pytest tests/workflow/test_alpha_journey.py tests/app/test_web_foundation.py -q"
    instruccion: "Confirm the alpha journey passes and every failure is rendered as an actionable finding."

  static_analysis:
    lint: "N/A — no linter is configured in the current project"
    type_check: "N/A — no static type checker is configured in the current project"
    secret_scan: "N/A — repository secret scanning is outside this stabilization spec"
    dependency_scan: "N/A — no dependency change is authorized by this spec"

  model_graders:
    - nombre: "Researcher actionability of validation findings"
      tipo: "rubric"
      rubrica: |
        A researcher unfamiliar with JSON internals can identify:
        1. which document or project file has a problem;
        2. whether the problem blocks Data Package generation;
        3. what action is required next;
        4. that HEVA did not silently overwrite canonical data.
        The interface uses working, valid, and exported accurately and does not describe
        HEVA output as curator-approved, repository-accepted, or published.
      calibrado_con_humano: false
      dataset: "evals/fixtures/alpha-2-validation-scenarios.jsonl"

  metrics:
    - nombre: "Supported alpha journey completion"
      umbral_minimo: "100% of required journey gates pass for the dummy alpha project"
      umbral_objetivo: "100% for the dummy project and the researcher-selected real alpha dataset"
      descripcion: "Researchers can complete the promised workflow and obtain a validated Data Package."
      measurement_method: "automated"
    - nombre: "Corruption detection before package generation"
      umbral_minimo: "100% of known structural and semantic corruption fixtures block generation"
      umbral_objetivo: "100%, with file-specific and repair-oriented findings"
      descripcion: "Manual or scripted damage cannot silently enter a distributed research dataset."
      measurement_method: "automated"
    - nombre: "Readiness-state consistency"
      umbral_minimo: "100% agreement between persisted state, CLI validation, GUI gates, and export eligibility"
      umbral_objetivo: "100% agreement after every supported state-changing action"
      descripcion: "Researchers can trust working, valid, and exported outcomes without encountering hidden approval gates."
      measurement_method: "automated"
    - nombre: "Repository-governance independence"
      umbral_minimo: "100% of otherwise valid Alpha fixtures export without internal approval artifacts"
      umbral_objetivo: "100%, with no submission or approval step in the documented journey"
      descripcion: "Researchers can deliver value through HEVA while their chosen repository owns review and publication."
      measurement_method: "automated"
    - nombre: "Document-validation availability"
      umbral_minimo: "100% of active documents expose a validation action and render its result"
      umbral_objetivo: "100% agreement between GUI, domain, CLI, and export findings"
      descripcion: "Researchers can run HEVA's primary quality check where they review a document."
      measurement_method: "automated"
    - nombre: "Minimal distribution contract"
      umbral_minimo: "100% of valid annotation-only fixtures export without optional source-governance metadata"
      umbral_objetivo: "100%, while every export retains a dataset license and rights statement"
      descripcion: "Validation protects the distributed annotation dataset without reproducing repository or source-governance workflows."
      measurement_method: "automated"
    - nombre: "Document contributor attribution"
      umbral_minimo: "100% of exported documents identify at least one explicitly assigned original annotator"
      umbral_objetivo: "100% agreement across project people, document metadata, GUI checklist, validation, and export"
      descripcion: "Original annotation authorship is explicit and never inferred from the active curator."
      measurement_method: "automated"
    - nombre: "Canonical-data preservation"
      umbral_minimo: "0 unapproved modifications during validation and diagnosis"
      umbral_objetivo: "0 modifications; proposed repairs are written separately"
      descripcion: "Validation is safe to run even when project data has been manually corrupted."
      measurement_method: "automated"

  eval_type: "regression"
  eval_phase: "pre-merge"
  graduation_criteria: "All automated gates pass and one human alpha walkthrough approves the business rubric."
  pass_metric: "pass@1"
  reassess_when:
    - "A researcher reports a silent failure or contradictory readiness state."
    - "The canonical HEVA schema or controlled vocabulary changes with human approval."
    - "A new external script is authorized to modify canonical project data."

  security:
    secretos: "prohibido"
    datos_sensibles: "Synthetic fixtures by default; real alpha data remains subject to document rights."
    permisos_herramientas:
      - "git: read/write on a feature branch; no push, merge, or activation without human approval"
      - "test suite: full execution"
      - "project data: read and diagnose; write only a separate proposed repair"

  safety_claims:
    - failure_mode: "Corrupted canonical JSON is accepted into a generated Data Package."
      mitigated_by: "A2-VAL-001, A2-VAL-002, A2-FLOW-002"
      residual_risk: "Unknown corruption classes require new fixtures and human reassessment."
      last_validated: "pending implementation evidence"
    - failure_mode: "Diagnosis or repair destroys valid research data."
      mitigated_by: "Canonical-data preservation metric and destructive_action human gate"
      residual_risk: "A human may approve an incorrect repair; the retained original enables recovery."
      last_validated: "pending implementation evidence"

  autonomy_level: "A1"
  orchestration_pattern: "single-agent"
  max_agent_exchanges: null
  stop_conditions:
    - "An active EVA criterion or threshold would need to be weakened or changed."
    - "Valid annotations, stable IDs, or review decisions could be lost or reinterpreted."
    - "Corrupted data cannot be repaired without overwriting the retained original."
    - "The HEVA schema or controlled label vocabulary would need to change."
    - "Test evidence contradicts the active hypothesis."
    - "The same evaluation fails three times for the same unresolved cause."
    - "Work expands into extraction algorithms or publication governance."
  budget_limit_usd: null
  budget_mode: "advisory"
  human_gates:
    - tipo: "arquitectura"
      obligatorio: true
      condicion: "A human approves activation, supersession, or material changes to this EVA specification."
    - tipo: "destructive_action"
      obligatorio: true
      condicion: "Replacing, deleting, or overwriting canonical project data requires explicit human approval."
    - tipo: "release"
      obligatorio: true
      condicion: "All EVA evidence and the human alpha walkthrough are complete."

  hypothesis:
    statement: |
      If HEVA uses one consistent validation contract across persisted project state, CLI,
      GUI, and export, blocks corrupted canonical data without modifying it, and leaves
      approval to research repositories, researchers will complete the Alpha workflow and
      trust the resulting Data Package without encountering hidden governance gates.
    based_on: "none — first formal EVA trial, informed by Alpha 2 human feedback"
    falsifiable_condition: |
      The hypothesis is falsified if a supported corruption fixture reaches package output,
      any readiness surface contradicts persisted state, or a researcher cannot complete
      the defined alpha journey without manually editing JSON or completing an internal
      submission, curator-acceptance, or data-owner-approval step.

  end_to_end_verification:
    dashboard_check: "N/A — local research application"
    api_endpoint_check: "GET / and the project validation routes through FastAPI TestClient"
    ui_check: "Open the incomplete dummy project, complete visible preparation gates, validate, and export without an internal approval step."
    smoke_command: "python -m pytest tests/workflow/test_alpha_journey.py tests/app/test_web_foundation.py -q"
    rollback_criteria: "Any canonical-data mutation during validation or any false complete status."
  runtime_signals: []
