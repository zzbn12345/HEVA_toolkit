<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curator review · HEVA Toolkit</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/curation.css?v=2">
  <script src="/static/curation.js?v=3" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="home-link" href="/">← HEVA home</a>
    <nav class="topbar-links"><a class="guide-link" href="/guide/CURATION">Guide</a><span>Curator review</span></nav>
  </header>
  <main class="page-content curator-page">
    <p class="eyebrow">Local curator queue</p>
    <h1>Inspect submitted evidence.</h1>
    <p class="lead">
      Every decision is tied to the exact validated candidate submitted by an annotator.
      Local review remains available without GitHub configuration.
    </p>
    <div id="curation-status" class="notice neutral" aria-live="polite">
      Loading project and validation evidence…
    </div>
    <div class="curation-filters" role="group" aria-label="Filter curator documents">
      <button class="button secondary active" type="button" data-curation-filter="in_review">Awaiting review</button>
      <button class="button secondary" type="button" data-curation-filter="attention">Needs attention</button>
      <button class="button secondary" type="button" data-curation-filter="valid">Valid</button>
      <button class="button secondary" type="button" data-curation-filter="all">All documents</button>
    </div>
    <section id="curation-queue" class="curation-queue" aria-label="Curator document queue"></section>
  </main>
</body>
</html>
