<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validate project · HEVA Toolkit</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/validate.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="home-link" href="/">← HEVA home</a>
    <span>Project validation</span>
  </header>
  <main class="page-content">
    <p class="eyebrow">Validation</p>
    <h1>Is this project ready?</h1>
    <p class="lead">HEVA checks the records and the decisions around them. Nothing is changed by this check.</p>
    <button id="validate-project" class="button" type="button">Validate project</button>
    <div id="validation-status" class="notice neutral" aria-live="polite">
      Select Validate project to begin.
    </div>
    <section id="validation-results" class="results" aria-label="Validation results"></section>
  </main>
</body>
</html>
