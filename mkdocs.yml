site_name: HEVA Toolkit
site_description: Create and validate heritage-value annotation Data Packages.
repo_url: https://github.com/jurra/heva-toolkit
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    primary: deep purple
    accent: teal

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Start: index.md
  - Install and run: INSTALLATION.md
  - HEVA and validation: HEVA_AND_VALIDATION.md
  - What is a Data Package?: DATA_PACKAGE.md
  - Tutorial: TUTORIAL.md
  - Software design: SOFTWARE_DESIGN.md
