site_name: HEVA Toolkit
site_description: Create, review, validate, and distribute heritage-value annotation packages.
repo_url: https://github.com/zzbn12345/HEVA_DCC_collab
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    primary: deep purple
    accent: teal

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Welcome: index.md
  - Quickstart: quickstart.md
  - Guides:
      - Create a project: guides/create-project.md
      - Review color meanings: guides/review-colors.md
      - Validate a project: guides/validate-project.md
      - Edit with CSV: guides/edit-with-csv.md
      - Distribute without sources: guides/distribute-without-sources.md
      - Publish the private Wiki: guides/publish-documentation.md
  - Concepts:
      - Guided review workflow: GUIDED_REVIEW_WORKFLOW.md
      - Project boundaries: PROJECT_BOUNDARIES.md
      - Validation: VALIDATION.md
      - Record contract: HEVA_RECORD_CONTRACT.md
      - Document metadata: DOCUMENT_METADATA.md
      - People and workflow roles: PEOPLE_AND_ROLES.md
      - Color mapping: COLOR_MAPPING.md
      - Project registry: PROJECT_REGISTRY.md
      - Extraction sessions: EXTRACTION_SESSIONS.md
      - Quality flags: QUALITY_FLAGS.md
      - Sentence review: SENTENCE_REVIEW.md
      - Curation: CURATION.md
      - Approved export: APPROVED_EXPORT.md
      - Evaluation and limitations: EVALUATION.md
  - Reference:
      - Architecture: ARCHITECTURE.md
      - Extraction: README_VE.md
      - Automatic color mapper: AUTO_COLOR_MAPPER_ARCHITECTURE.md
      - Commands: reference/command-line.md
      - Package layout: reference/package-layout.md
