name: Publish HEVA documentation to Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/heva/wiki.py"
      - "tests/curation/test_wiki.py"
      - ".github/workflows/docs-wiki.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/heva/wiki.py"
      - "tests/curation/test_wiki.py"
      - ".github/workflows/docs-wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-documentation
  cancel-in-progress: false

jobs:
  validate-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the toolkit
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install HEVA
        run: python -m pip install .
      - name: Build Wiki pages
        run: python -m heva.wiki docs wiki-build
      - name: Upload Wiki preview
        uses: actions/upload-artifact@v4
        with:
          name: heva-wiki-preview
          path: wiki-build

  publish:
    if: github.event_name != 'pull_request'
    needs: validate-wiki
    runs-on: ubuntu-latest
    steps:
      - name: Check out the toolkit
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install HEVA
        run: python -m pip install .
      - name: Build Wiki pages
        run: python -m heva.wiki docs wiki-build
      - name: Require Wiki publishing token
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "Add a WIKI_TOKEN repository secret with permission to write this private repository."
            exit 1
          fi
      - name: Clone initialized Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repository || {
            echo "Initialize the Wiki by creating its first page in GitHub, then rerun this workflow."
            exit 1
          }
      - name: Synchronize generated pages
        run: |
          find wiki-repository -maxdepth 1 -type f -name '*.md' -delete
          cp wiki-build/*.md wiki-repository/
      - name: Publish changed pages
        working-directory: wiki-repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki already matches the toolkit documentation."
            exit 0
          fi
          git commit -m "docs: synchronize toolkit documentation"
          git push origin HEAD
