<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="100%" role="img" aria-labelledby="cm-title cm-desc" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="cm-title">From colors to values</title>
  <desc id="cm-desc">Left: Discover colors lists the observed highlight colors of a document, each pending review. An optional local AI suggestion can pre-fill the choices; it is a suggestion, not an approval. Middle: your decision. Under Assign colors to, choose the built-in HEVA heritage values (social, economic, political, historic, aesthetical, scientific, age, ecological) or your own value set, for example Community wellbeing values (physical, mental, social-support). For each color choose a value, or Ignore this color with a reason. Tick I reviewed every observed color and press Confirm color configuration. Right: confirming saves the decision in the document's metadata, saves or reuses a versioned project palette (color to value, linked to its value set) selected for the project, and turns the raw draft into canonical annotations in documents/ID/annotations.json where colors are replaced by values. Documents with exactly the same colors can reuse a confirmed mapping in a batch. Several shades can mean the same value; one shade can never mean two values.</desc>
  <defs>
    <marker id="cm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="cm-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="810" rx="16" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="50" font-size="22" font-weight="700" fill="#0f172a">From colors to values</text>
  <text x="40" y="76" font-size="13" fill="#475569">In Color configuration you decide what each highlight color means. HEVA only applies a mapping after you confirm it.</text>

  <!-- ============ Left: Discover colors ============ -->
  <rect x="40" y="110" width="260" height="230" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="56" y="140" font-size="15" font-weight="600" fill="#0f172a">Discover colors</text>
  <text font-size="13" fill="#475569">
    <tspan x="56" y="164">HEVA lists the colors it</tspan>
    <tspan x="56" dy="18">observed in the document.</tspan>
  </text>
  <g font-size="12">
    <rect x="56" y="200" width="20" height="20" rx="4" fill="#FFFF00" stroke="#94a3b8"/>
    <text x="84" y="215" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">#FFFF00</text>
    <rect x="166" y="199" width="118" height="22" rx="11" fill="#ffffff" stroke="#94a3b8"/>
    <text x="225" y="214" fill="#475569" text-anchor="middle">pending review</text>

    <rect x="56" y="234" width="20" height="20" rx="4" fill="#00FF00" stroke="#94a3b8"/>
    <text x="84" y="249" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">#00FF00</text>
    <rect x="166" y="233" width="118" height="22" rx="11" fill="#ffffff" stroke="#94a3b8"/>
    <text x="225" y="248" fill="#475569" text-anchor="middle">pending review</text>

    <rect x="56" y="268" width="20" height="20" rx="4" fill="#FF40FF" stroke="#94a3b8"/>
    <text x="84" y="283" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">#FF40FF</text>
    <rect x="166" y="267" width="118" height="22" rx="11" fill="#ffffff" stroke="#94a3b8"/>
    <text x="225" y="282" fill="#475569" text-anchor="middle">pending review</text>

    <rect x="56" y="302" width="20" height="20" rx="4" fill="#00D6FF" stroke="#94a3b8"/>
    <text x="84" y="317" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">#00D6FF</text>
    <rect x="166" y="301" width="118" height="22" rx="11" fill="#ffffff" stroke="#94a3b8"/>
    <text x="225" y="316" fill="#475569" text-anchor="middle">pending review</text>
  </g>

  <!-- Optional AI suggestion -->
  <rect x="40" y="430" width="260" height="106" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="458" font-size="15" font-weight="600" fill="#0f172a">Optional: AI suggestion</text>
  <text font-size="13" fill="#475569">
    <tspan x="56" y="482">A local AI (Ollama) can pre-fill</tspan>
    <tspan x="56" dy="18">your choices. It is a suggestion,</tspan>
    <tspan x="56" dy="18">not an approval.</tspan>
  </text>

  <!-- ============ Middle: your decision ============ -->
  <rect x="350" y="110" width="440" height="548" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="370" y="140" font-size="15" font-weight="600" fill="#0f172a">Your decision</text>
  <g>
    <rect x="712" y="98" width="58" height="24" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="728" cy="106" r="3.5" fill="#d97706"/>
    <path d="M722,117 a6,5.5 0 0 1 12,0 z" fill="#d97706"/>
    <text x="739" y="115" font-size="12" font-weight="700" fill="#92400e">You</text>
  </g>

  <text x="370" y="170" font-size="13" font-weight="700" fill="#0f172a">Assign colors to:</text>
  <!-- Option A -->
  <rect x="366" y="182" width="408" height="80" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="386" cy="204" r="7" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="386" cy="204" r="3.5" fill="#d97706"/>
  <text x="402" y="209" font-size="13" font-weight="700" fill="#0f172a">HEVA heritage values <tspan font-weight="400" fill="#475569">(built in)</tspan></text>
  <text font-size="12" fill="#475569">
    <tspan x="402" y="231">social · economic · political · historic</tspan>
    <tspan x="402" dy="18">aesthetical · scientific · age · ecological</tspan>
  </text>
  <!-- Option B -->
  <rect x="366" y="272" width="408" height="80" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <circle cx="386" cy="294" r="7" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="402" y="299" font-size="13" font-weight="700" fill="#0f172a">or your own value set</text>
  <text font-size="12" fill="#475569">
    <tspan x="402" y="321">Example: “Community wellbeing values”</tspan>
    <tspan x="402" dy="18">physical · mental · social-support</tspan>
  </text>

  <text x="370" y="380" font-size="13" font-weight="700" fill="#0f172a">For each color, choose:</text>
  <g font-size="13">
    <rect x="366" y="395" width="20" height="20" rx="4" fill="#FFFF00" stroke="#94a3b8"/>
    <text x="394" y="410" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">#FFFF00</text>
    <path d="M462,405 H497" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#cm-arrow)"/>
    <rect x="504" y="392" width="270" height="26" rx="6" fill="#ffffff" stroke="#d6d3d1"/>
    <text x="516" y="410" fill="#0f172a">economic</text>
    <text x="760" y="410" fill="#475569" text-anchor="middle">▾</text>

    <rect x="366" y="429" width="20" height="20" rx="4" fill="#00FF00" stroke="#94a3b8"/>
    <text x="394" y="444" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">#00FF00</text>
    <path d="M462,439 H497" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#cm-arrow)"/>
    <rect x="504" y="426" width="270" height="26" rx="6" fill="#ffffff" stroke="#d6d3d1"/>
    <text x="516" y="444" fill="#0f172a">social</text>
    <text x="760" y="444" fill="#475569" text-anchor="middle">▾</text>

    <rect x="366" y="463" width="20" height="20" rx="4" fill="#FF40FF" stroke="#94a3b8"/>
    <text x="394" y="478" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">#FF40FF</text>
    <path d="M462,473 H497" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#cm-arrow)"/>
    <rect x="504" y="460" width="270" height="26" rx="6" fill="#ffffff" stroke="#d6d3d1"/>
    <text x="516" y="478" fill="#0f172a">historic</text>
    <text x="760" y="478" fill="#475569" text-anchor="middle">▾</text>

    <rect x="366" y="497" width="20" height="20" rx="4" fill="#00D6FF" stroke="#94a3b8"/>
    <text x="394" y="512" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">#00D6FF</text>
    <path d="M462,507 H497" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#cm-arrow)"/>
    <rect x="504" y="494" width="270" height="26" rx="6" fill="#ffffff" stroke="#d6d3d1"/>
    <text x="516" y="512" fill="#0f172a">Ignore this color</text>
    <text x="760" y="512" fill="#475569" text-anchor="middle">▾</text>
    <rect x="504" y="526" width="270" height="26" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-dasharray="3 2"/>
    <text x="516" y="544" font-size="12" fill="#475569">Reason: e.g. the annotator's own notes</text>
  </g>

  <!-- Arrows from the left column (drawn above the container) -->
  <path d="M300,270 H325 V405 H359" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#cm-arrow)"/>
  <path d="M300,473 H359" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cm-arrow-violet)"/>

  <!-- Tick and confirm -->
  <rect x="366" y="570" width="16" height="16" rx="3" fill="#d97706"/>
  <path d="M369.5,578 L373,581.5 L379,574.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="392" y="583" font-size="13" fill="#0f172a">I reviewed every observed color…</text>
  <rect x="366" y="600" width="250" height="38" rx="8" fill="#d97706"/>
  <text x="491" y="624" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Confirm color configuration</text>

  <path d="M616,619 H815 V334 H839" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#cm-arrow)"/>

  <!-- ============ Right: what confirming does ============ -->
  <rect x="840" y="110" width="320" height="448" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="860" y="140" font-size="15" font-weight="600" fill="#0f172a">When you confirm, HEVA:</text>

  <rect x="856" y="156" width="288" height="80" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="878" cy="180" r="12" fill="#059669"/>
  <text x="878" y="185" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="898" y="185" font-size="15" font-weight="600" fill="#0f172a">Saves your decision</text>
  <text x="870" y="212" font-size="13" fill="#475569">in the document's metadata.</text>

  <rect x="856" y="252" width="288" height="134" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="878" cy="276" r="12" fill="#059669"/>
  <text x="878" y="281" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="898" y="281" font-size="15" font-weight="600" fill="#0f172a">Saves a project palette</text>
  <text font-size="13" fill="#475569">
    <tspan x="870" y="308">Saves (or reuses) a versioned</tspan>
    <tspan x="870" dy="18">palette: color → value, linked</tspan>
    <tspan x="870" dy="18">to its value set, and selects it</tspan>
    <tspan x="870" dy="18">for the project.</tspan>
  </text>

  <rect x="856" y="402" width="288" height="140" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="878" cy="426" r="12" fill="#059669"/>
  <text x="878" y="431" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="898" y="431" font-size="15" font-weight="600" fill="#0f172a">Creates the annotations</text>
  <text font-size="13" fill="#475569">
    <tspan x="870" y="458">Turns the raw draft into canonical</tspan>
    <tspan x="870" dy="18">annotations: colors are replaced</tspan>
    <tspan x="870" dy="18">by values.</tspan>
  </text>
  <text x="870" y="520" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#065f46">documents/&lt;ID&gt;/annotations.json</text>

  <!-- Reuse side note -->
  <rect x="840" y="578" width="320" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="856" y="602" font-size="13" font-weight="700" fill="#0f172a">Reuse</text>
  <text font-size="13" fill="#475569">
    <tspan x="856" y="622">Documents with exactly the same colors</tspan>
    <tspan x="856" dy="18">can reuse a confirmed mapping (batch).</tspan>
  </text>

  <!-- Shades note -->
  <rect x="40" y="690" width="1120" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="60" y="706" width="20" height="20" rx="4" fill="#FFFF00" stroke="#94a3b8"/>
  <rect x="86" y="706" width="20" height="20" rx="4" fill="#FFFF80" stroke="#94a3b8"/>
  <text x="122" y="721" font-size="13" fill="#475569"><tspan font-weight="700" fill="#0f172a">Several shades can mean the same value; one shade can never mean two values.</tspan> For example, both yellows above can mean economic.</text>

  <!-- Legend -->
  <text x="40" y="784" font-size="12" font-weight="700" fill="#0f172a">Legend</text>
  <rect x="110" y="772" width="24" height="16" rx="4" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="142" y="784" font-size="12" fill="#475569">HEVA works automatically</text>
  <rect x="340" y="772" width="24" height="16" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="372" y="784" font-size="12" fill="#475569">You decide</text>
  <rect x="490" y="772" width="24" height="16" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-dasharray="4 3"/>
  <text x="522" y="784" font-size="12" fill="#475569">Optional local AI</text>
  <rect x="680" y="772" width="24" height="16" rx="4" fill="#d1fae5" stroke="#059669"/>
  <text x="712" y="784" font-size="12" fill="#475569">Saved by HEVA</text>
</svg>
