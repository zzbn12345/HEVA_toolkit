<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="100%" role="img" aria-labelledby="ap-title ap-desc" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="ap-title">Optional automatic color proposals (local AI)</title>
  <desc id="ap-desc">Six steps. 1: unresolved colors have no decision or suggestion yet. 2: HEVA collects evidence, up to 25 sentences per color that contain it. 3: the evidence and the allowed values of the selected value set are sent to Ollama running on your computer (default model llama3.1:8b at http://127.0.0.1:11434); nothing leaves your computer. 4: the model returns a value and a short reasoning per color. 5: HEVA checks that the values are allowed and saves them as suggested; the status stays pending review. 6: you review the pre-filled choices, change any, tick and confirm. Suggestions are never approvals. If Ollama is not running or the model is missing, nothing changes and HEVA shows an error.</desc>
  <defs>
    <marker id="ap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="710" rx="16" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="50" font-size="22" font-weight="700" fill="#0f172a">Optional automatic color proposals (local AI)</text>
  <text x="40" y="76" font-size="13" fill="#475569">A local AI model can pre-fill the color choices in Color configuration. You stay in charge: nothing counts until you confirm.</text>

  <!-- Row 1 -->
  <!-- Step 1: input -->
  <rect x="40" y="110" width="340" height="190" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="66" cy="138" r="13" fill="#64748b"/>
  <text x="66" y="143" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="88" y="144" font-size="15" font-weight="600" fill="#0f172a">Unresolved colors</text>
  <text font-size="13" fill="#475569">
    <tspan x="56" y="174">Colors that have no decision and</tspan>
    <tspan x="56" dy="18">no suggestion yet.</tspan>
  </text>
  <rect x="56" y="214" width="20" height="20" rx="4" fill="#00FF00" stroke="#94a3b8"/>
  <text x="84" y="229" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">#00FF00</text>
  <text x="160" y="229" font-size="12" fill="#475569">no value yet</text>
  <rect x="56" y="246" width="20" height="20" rx="4" fill="#00D6FF" stroke="#94a3b8"/>
  <text x="84" y="261" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">#00D6FF</text>
  <text x="160" y="261" font-size="12" fill="#475569">no value yet</text>

  <path d="M380,205 H429" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ap-arrow)"/>

  <!-- Step 2: evidence -->
  <rect x="430" y="110" width="340" height="190" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <circle cx="456" cy="138" r="13" fill="#4f46e5"/>
  <text x="456" y="143" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="478" y="144" font-size="15" font-weight="600" fill="#0f172a">HEVA collects evidence</text>
  <text font-size="13" fill="#475569">
    <tspan x="446" y="174">For each color, up to 25 sentences</tspan>
    <tspan x="446" dy="18">that contain it.</tspan>
  </text>
  <g>
    <rect x="446" y="214" width="300" height="9" rx="4.5" fill="#c7d2fe"/>
    <rect x="530" y="214" width="70" height="9" rx="4.5" fill="#00FF00"/>
    <rect x="446" y="232" width="260" height="9" rx="4.5" fill="#c7d2fe"/>
    <rect x="470" y="232" width="96" height="9" rx="4.5" fill="#00FF00"/>
    <rect x="446" y="250" width="290" height="9" rx="4.5" fill="#c7d2fe"/>
    <rect x="610" y="250" width="80" height="9" rx="4.5" fill="#00FF00"/>
  </g>
  <text x="446" y="282" font-size="12" fill="#475569">Example sentences for #00FF00</text>

  <path d="M770,205 H819" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ap-arrow)"/>

  <!-- Step 3: local AI -->
  <rect x="820" y="110" width="340" height="190" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="846" cy="138" r="13" fill="#7c3aed"/>
  <text x="846" y="143" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="868" y="144" font-size="15" font-weight="600" fill="#0f172a">Ollama on your computer</text>
  <text font-size="13" fill="#475569">
    <tspan x="836" y="174">HEVA sends the evidence and the list</tspan>
    <tspan x="836" dy="18">of allowed values from the selected</tspan>
    <tspan x="836" dy="18">value set.</tspan>
  </text>
  <text font-size="12" fill="#475569">
    <tspan x="836" y="234">Default model: <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#5b21b6">llama3.1:8b</tspan></tspan>
    <tspan x="836" dy="18">Address: <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#5b21b6">http://127.0.0.1:11434</tspan></tspan>
  </text>
  <text x="836" y="282" font-size="13" font-weight="700" fill="#0f172a">Nothing leaves your computer.</text>

  <!-- Wrap to row 2 -->
  <path d="M990,300 V330 H210 V359" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ap-arrow)"/>

  <!-- Row 2 -->
  <!-- Step 4: model answers -->
  <rect x="40" y="360" width="340" height="190" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="66" cy="388" r="13" fill="#7c3aed"/>
  <text x="66" y="393" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="88" y="394" font-size="15" font-weight="600" fill="#0f172a">The model answers</text>
  <text font-size="13" fill="#475569">
    <tspan x="56" y="424">For each color: one value and a</tspan>
    <tspan x="56" dy="18">short reasoning.</tspan>
  </text>
  <rect x="56" y="458" width="308" height="74" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <rect x="70" y="470" width="18" height="18" rx="4" fill="#00FF00" stroke="#94a3b8"/>
  <text x="98" y="484" font-size="13" font-weight="700" fill="#0f172a">social</text>
  <text font-size="12" fill="#475569">
    <tspan x="70" y="506">Example reasoning: “The sentences</tspan>
    <tspan x="70" dy="16">describe neighbors meeting.”</tspan>
  </text>

  <path d="M380,455 H429" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ap-arrow)"/>

  <!-- Step 5: check and save -->
  <rect x="430" y="360" width="340" height="190" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <circle cx="456" cy="388" r="13" fill="#4f46e5"/>
  <text x="456" y="393" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="478" y="394" font-size="15" font-weight="600" fill="#0f172a">HEVA checks and saves</text>
  <text font-size="13" fill="#475569">
    <tspan x="446" y="424">Checks that each value is allowed,</tspan>
    <tspan x="446" dy="18">then saves it as “suggested”.</tspan>
    <tspan x="446" dy="18">The status stays “pending review”.</tspan>
  </text>
  <rect x="446" y="488" width="96" height="24" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="494" y="504" font-size="12" fill="#5b21b6" text-anchor="middle">suggested</text>
  <rect x="552" y="488" width="120" height="24" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text x="612" y="504" font-size="12" fill="#475569" text-anchor="middle">pending review</text>

  <path d="M770,455 H819" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ap-arrow)"/>

  <!-- Step 6: you review -->
  <rect x="820" y="360" width="340" height="190" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="846" cy="388" r="13" fill="#d97706"/>
  <text x="846" y="393" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="868" y="394" font-size="15" font-weight="600" fill="#0f172a">You review and confirm</text>
  <text font-size="13" fill="#475569">
    <tspan x="836" y="424">The choices are pre-filled. Change</tspan>
    <tspan x="836" dy="18">any of them, tick “I reviewed every</tspan>
    <tspan x="836" dy="18">observed color…” and confirm.</tspan>
  </text>
  <rect x="836" y="484" width="220" height="32" rx="8" fill="#d97706"/>
  <text x="946" y="505" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Confirm color configuration</text>
  <g>
    <rect x="1090" y="348" width="58" height="24" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="1106" cy="356" r="3.5" fill="#d97706"/>
    <path d="M1100,367 a6,5.5 0 0 1 12,0 z" fill="#d97706"/>
    <text x="1117" y="365" font-size="12" font-weight="700" fill="#92400e">You</text>
  </g>

  <!-- Notes -->
  <rect x="40" y="580" width="550" height="66" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <circle cx="68" cy="613" r="11" fill="none" stroke="#475569" stroke-width="1.6"/>
  <text x="68" y="618" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">!</text>
  <text font-size="13" fill="#475569">
    <tspan x="92" y="608"><tspan font-weight="700" fill="#0f172a">If Ollama is not running or the model is missing,</tspan></tspan>
    <tspan x="92" dy="18">nothing changes; HEVA shows an error.</tspan>
  </text>

  <rect x="610" y="580" width="550" height="66" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="638" cy="610" r="5" fill="#d97706"/>
  <path d="M630,624 a8,7 0 0 1 16,0 z" fill="#d97706"/>
  <text font-size="13" fill="#475569">
    <tspan x="662" y="606" font-size="15" font-weight="700" fill="#0f172a">Suggestions are never approvals.</tspan>
    <tspan x="662" dy="20">Only your confirmation applies a color mapping.</tspan>
  </text>

  <!-- Legend -->
  <text x="40" y="684" font-size="12" font-weight="700" fill="#0f172a">Legend</text>
  <rect x="110" y="672" width="24" height="16" rx="4" fill="#e2e8f0" stroke="#64748b"/>
  <text x="142" y="684" font-size="12" fill="#475569">Starting point</text>
  <rect x="270" y="672" width="24" height="16" rx="4" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="302" y="684" font-size="12" fill="#475569">HEVA works automatically</text>
  <rect x="500" y="672" width="24" height="16" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-dasharray="4 3"/>
  <text x="532" y="684" font-size="12" fill="#475569">Optional local AI</text>
  <rect x="680" y="672" width="24" height="16" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="712" y="684" font-size="12" fill="#475569">You decide</text>
</svg>
